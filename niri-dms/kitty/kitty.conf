# Theming

# Font
font_family 0xProto Nerd Font
font_size 11.0

# Set up powerline to always be vissible .
tab_bar_edge top
tab_bar_style powerline
tab_bar_min_tabs 2

# Cursor
cursor_shape beam
cursor_trail 1

# Padding (why weird value? consistency with foot)
single_window_margin_width 21.75
window_margin_width 0

# Set the separation line to a minimal 1-pixel thickness
window_border_width 1px
draw_minimal_borders yes

# No stupid close confirmation
confirm_os_window_close 0
remember_window_size no

# Hide mouse while typing
mouse_hide_wait -3
# Bash (Serpantinum)
shell /bin/bash


# use this layout 
enabled_layouts splits, stack



# ======================= customise kitty keybindings =======================================================================
# Copy
map ctrl+c copy_or_interrupt

# Search
map ctrl+f launch --location=hsplit --allow-remote-control kitty +kitten @HOME@/.config/niri-dms/kitty/search.py @active-kitty-window-id

# Scroll & Zoom
map page_up    scroll_page_up
map page_down    scroll_page_down

map ctrl+plus change_font_size all +1
map ctrl+equal change_font_size all +1

# Windows and Controls
# Alt+Enter is reserved by Niri to open a terminal.
map ctrl+shift+t new_tab
# Cycle to the next tab
map alt+n next_tab
# Cycle to the previous tab
map alt+p previous_tab

# Open new splits in the current directory using the current layout
map alt+h launch --cwd=current --location=hsplit
map alt+v launch --cwd=current --location=vsplit

# Navigate, open and close tabs using Alt + Arrow keys
map alt+left previous_tab
map alt+right next_tab
map alt+up new_tab
map alt+down close_tab


# Close the active split pane
map alt+c close_window

# Close the active tab
map alt+q close_tab

# Resize split panes using Ctrl + Alt + Arrow keys
map ctrl+alt+left resize_window narrower 3
map ctrl+alt+right resize_window wider 3
map ctrl+alt+up resize_window taller 3
map ctrl+alt+down resize_window shorter 3


# Rename the active tab
map alt+r set_tab_title
# Toggle maximizing the current split pane to full screen
map alt+f toggle_layout stack

# Jump directly to a pane by visual letter hints
map alt+k focus_visible_window

include themes/theme.conf

# Guia de atalhos do Kitty
map ctrl+shift+f1 launch --type=background @HOME@/.config/niri-dms/kitty/show-hotkeys

# Numbered tabs and no window title bar
tab_title_template "tab {index}"
active_tab_title_template "tab {index}"
hide_window_decorations yes

# Go directly to tab N
map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5
map alt+6 goto_tab 6
map alt+7 goto_tab 7
map alt+8 goto_tab 8
map alt+9 goto_tab 9
